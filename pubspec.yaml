name: appcraft_unused_assets
description: >-
  Finds assets that nothing references, by the accessors generated by
  flutter_gen rather than by string literals of their paths.
version: 0.0.1
repository: https://github.com/AppCraftTeam/appcraft-unused-assets-flutter
issue_tracker: https://github.com/AppCraftTeam/appcraft-unused-assets-flutter/issues

topics:
  - assets
  - cli
  - flutter-gen
  - cleanup

environment:
  sdk: ^3.0.0

executables:
  appcraft_unused_assets:

dependencies:
  analyzer: '>=8.0.0 <15.0.0'
  args: ^2.7.0
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
